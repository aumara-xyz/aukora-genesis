name: CORE
description: >-
  A session that does NOT hold Peter's authority. **THE CORE TOOL FILTER ITSELF GRANTS NO SHELL.** *The claim
  that stood here until aura-83 was "no shell, no network", and the second half was FALSE in the way that
  matters* — **the subagent providers are ON by Peter's decision, and neither ships a sandbox**
  (`agent.cordis.yml:16`: "Codex sends no sandbox by default and Claude Code defaults to `dontAsk`"), *so a
  child agent's network reach is NOT denied by this preset.* **What is actually true is narrower and worth
  stating exactly**: *this preset's own tool list carries no shell and no web tool, so a CORE session's direct
  reach is closed* — *and its CHILDREN are the open path, which is what gap 6 must pin.*
  Both subagent providers are ON by Peter's decision — code runs under CORE only through children that
  inherit CORE's own restrictions (a court asserted this until the forest was archived, ARCHIVE.md).
  Path scoping is NOT provided here — the fs policy is host-plane — so reads of state/launch.json,
  state/lane-door/, state/eye/, gate-state/ and every *.sock stay open until AUMLOK's deny-default
  profile lands. No test in this tree checks this file.
order: 3
