# The same keyless checks a reviewer runs from a fresh clone: `sh scripts/check.sh` (python3, Node.js 22, perl).
# It proves the repository's own checks pass on GitHub's machine. It does not measure the owner's installed app.
name: check
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - run: sh scripts/check.sh
      # Separate from precard: this fixture applies its own real Seatbelt profile.
      - name: Verify native Unix socket boundary
        run: node tests/aukora-precard-check.test.mjs --unix-boundary
