# Generated by ALPHA (alpha-15 privacy) — do not edit by hand.
#
# WHY THIS EXISTS. PETER'S RULE: private conversations stay on the user's computer. The egress audit
# (~/aukora-private/reviews/egress-audit-2026-09-26.md, gaps 1, 10, 15) found an upstream row,
# `session-log-deepseek`, ON BY DEFAULT, uploading the ENTIRE session log — every message, every tool call and every
# result, plus the working directory — to DeepSeek as `dsh_session_log` on every request: thousands of
# delivery-accepted events on the live machine, from every lane and from Auma.
#
# THE FORM IS THE LIVE `compaction.patch.yml` FORM, BECAUSE IT IS AN OVERRIDE AND NOT AN INSERT: a row is named by
# `id`, the profile keeps the row where it put it, and an override ASSIGNS ONLY THE KEYS IT NAMES — which is why each
# row below names the plugin's OWN switch rather than relying on anything else being absent. Inserting a second row
# with the same id is refused at composition.
#
# EACH SWITCH IS THE ONE THE PLUGIN ITSELF READS, READ FROM ITS SOURCE, not a guess:
#   session-log-deepseek            src/index.ts:45  enabled: z.boolean().default(true)   and :159  if (config.enabled !== true) return
#   plugin-package-inventory-deepseek src/index.ts:39 enabled: z.boolean().default(true)  and :193  if (config.enabled === false) return
#   session-telemetry-otel          src/index.ts:47-52  SessionTelemetryMode.DISABLED, default FEEDBACK_ONLY, and :168 skips on DISABLED
# So `config.enabled: false` is the value that cannot half-load for the two uploaders — the plugin loads, its guard
# returns before anything is registered — and `mode: DISABLED` is the telemetry equivalent of the same thing.
#
# VERIFIED AGAINST A REAL RELEASE (2026-09-27), BECAUSE A MISSING ID WOULD SILENTLY DO NOTHING: all three rows exist in
# the BASE PROFILE the release ships — `~/aukora-release-fbcc1f20a1cf/packages/bundle/base/cordis.patch.yml`, one row
# each, in the `- id: <id>` / `name: '@deepseek-ai/dsh-…'` form this override targets. THEY ARE NOT IN AUKORA'S OWN
# `aukora-composition.patch.yml`, and I checked that file first and briefly believed the overlay was wrong: the
# composition is the OVERLAY, while the rows being overridden live in the base profile, exactly as
# `compaction.patch.yml` overrides the base's `compaction-basic`. A reader who greps only the composition will reach
# the same wrong conclusion, so it is written down here.
- id: session-log-deepseek
  config:
    enabled: false
- id: plugin-package-inventory-deepseek
  config:
    enabled: false
- id: session-telemetry-otel
  config:
    mode: DISABLED
