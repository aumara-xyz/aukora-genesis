# THE ACTION GATE: every tool call by every agent session judged, receipted in the Aura chain, and escalated to the
# owner's approval route when it is an authority action. plugins/aukora-action-gate/lib/index.mjs says what it
# governs and what it does not.
#
# A RELEASE'S DEFAULT COMPOSITION NOW CARRIES THESE ROWS: scripts/materialize-aukora-release.py (`action_gate_rows`)
# copies them into aukora-composition.patch.yml, so a fresh install is gated without listing anything. A deployment
# that still lists `<release>/action-gate.patch.yml` applies them twice, which is harmless (same values; the loader
# keys rows by id, so the second insert replaces the first).
#
# IT REPLACES held-read-deny.patch.yml. It carries the same two rows, for the same reason:
#   - `aukora-core-read-deny` is the `fs` SWAP that crashed boot ("service fs has been registered"); it stays disabled,
#     and its CORE rows now live in the action gate's policy (CORE_ROWS), applied to tool calls;
#   - `fs-sandbox` provides `fs` again, as the stock composition does.
# The gate itself provides NO service (it registers a guard with `ctx.tools.guard()`), so it cannot collide with
# `fs-sandbox` or with itself.
#
# THE ROW NAME IS RELEASE-RELATIVE, and the loader anchors an inserted row's relative `name` BESIDE THIS FILE. So the
# materializer carries plugins/aukora-action-gate (LANE_PLUGINS) AND copies this file to `<release>/action-gate.patch.yml`;
# list THAT copy in the deployment. Applied from anywhere else, `name` must be made absolute into the release.
#
# `repoRoots` is the checkout lanes and Auma work in; its governing paths (plugins/**, apps/**, scripts/aukora/**,
# docs/owner-pin.json, AGENTS.md, ...) are refused as self-modification, with scripts/aukora/self-change.mjs named as
# the route. The running release is a governing root without being named: the gate adds the tree it was loaded from.
- id: fs-sandbox
  disabled: false

- id: aukora-core-read-deny
  disabled: true

- insert:
    - id: aukora-action-gate
      name: ./plugins/aukora-action-gate/lib/index.mjs
      config:
        auraDir: !!js dshHomePath('aura-actions')
        dshHome: !!js dshHomePath()
        # THE APPROVED TOOLS (#26). The harness's own tools are known to the gate's switch; every OTHER name a call
        # may use must be declared here, exactly or as a family ending in `*`, or the gate refuses it with
        # `authority:tool-not-approved` and names scripts/aukora/self-change.mjs. Seeded from what the live action
        # chain shows IS used plus the families; a name missing here locks that tool out after the restart, so this
        # list is the deployment's own contract and widens only by a self-change like any other governed edit.
        allowTools:
          - bash
          - read
          - write
          - edit
          - grep
          - glob
          - web_fetch
          - web_search
          - present
          - read_image
          - str_replace_editor
          - skill
          - todo_write
          - ask_user_question
          - workflow
          - aura_association
          - send_message
          - interrupt_agent
          - list_agents
          - exit_plan_mode
          - get_goal
          - create_goal
          - update_goal
          - read_mcp_resource
          - subagent
          - subagent_aura
          - subagent_aura_court
          - subagent_court
          - subagent_fork
          - session_search
          - session_trace
          - session_event_search
          - session_event_read
          - session_event_trace
          - job_output
          - job_list
          - job_kill
          - kira_*
          - memory.put
          - mcp__viking__*
          - mcp__kira-memory__*
          - cordis_inspect_*
          - subagent*
          - session_*
          - job_*
          - list_*
          # The trusted host tool this plugin registers when worktreesRoot is set (lib/self-change-tool.mjs).
          - aukora_self_change
          - aukora_workspace_patch
        repoRoots:
          - !!js process.env.HOME + '/aukora-genesis'
        # Registers `aukora_self_change`: the owner's self-change.mjs (the first repoRoot) run on the host against a
        # worktree directly under this root. A contained shell cannot reach the signer, so this is its one route.
        worktreesRoot: !!js process.env.HOME + '/aukora-worktrees'
        # Where agents may also write: lane worktrees (proposals go there, then self-change), temp, and the owner's
        # everyday folders. Key material stays refused inside every one of them.
        extraWritableRoots:
          - !!js process.env.HOME + '/aukora-worktrees'
          - !!js process.env.TMPDIR || '/private/tmp'
          - /private/tmp
          - !!js process.env.HOME + '/Desktop'
          - !!js process.env.HOME + '/Documents'
          - !!js process.env.HOME + '/Downloads'

# THE SEATBELT, BY DEFAULT (plugins/aukora-seatbelt; overlays/seatbelt.patch.yml says what it stops). Every confined
# agent command (bash, terminal, run_code, the web shell in `read-only` or `workspace-write`) carries AUKORA's denies:
# key material, the signer socket, the receipt chains, and no write to ~/aukora-genesis or the support root, even as
# the session workspace. `workspace-write` may also write ~/aukora-worktrees. `danger-full-access` is never confined.
# The base `sandbox` row is disabled and this one inserted (`ctx.provide` refuses a second `sandbox`).
- id: sandbox
  disabled: true

- insert:
    - id: aukora-seatbelt
      name: ./plugins/aukora-seatbelt/lib/index.mjs
      config:
        home: !!js process.env.HOME
        supportRoot: !!js process.env.HOME + '/Library/Application Support/AUKORA'
        dshHome: !!js dshHomePath()
