name: diamond

# Fresh-clone proof that the Diamond courts are GREEN at an exact SHA.
#
# Every step prints the commit it ran against, so a green check can never be
# mistaken for a green check of some other revision. This workflow executes the
# committed acceptance entry points a stranger runs locally; it adds no privileges, no
# secrets, and no network beyond pip.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Only automatically triggered PR runs share a group. Main, workflow_dispatch
# and manual reruns get unique groups and cannot cancel one another.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}-{1}', github.run_id, github.run_attempt) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.run_attempt == 1 }}

jobs:
  diamond:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      EXPECTED_CI_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Review the exact PR head, not GitHub's synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # Full history so the printed SHA is unambiguous.
          fetch-depth: 0

      - name: Print exact SHA under test
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CI_SHA"
          echo "DIAMOND_CI_SHA=$(git rev-parse HEAD)"
          git rev-parse HEAD
          git log -1 --oneline

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: venv + pynacl
        run: |
          python3 -m venv .venv
          . .venv/bin/activate
          python -m pip install --upgrade pip
          pip install 'pynacl>=1.5'
          python -c "import nacl; print('pynacl', nacl.__version__)"

      - name: Diamond court
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          ./scripts/diamond.sh

      - name: Stranger scenarios (Diamond court already ran)
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          ./scripts/stranger-demo.sh --scenarios-only

      - name: v3-genesis sibling kind acceptance
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          python3 scripts/verify-v3-genesis-acceptance.py

      - name: Aumlok owner-approval verification (offline controls)
        run: |
          . .venv/bin/activate
          python3 -B tests/aumlok-approval/test_aumlok_approval.py

      - name: Genesis-minted receipt acceptance (Stage 0 consumer readiness)
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          python3 scripts/verify-genesis-minted-acceptance.py

      - name: "Alpha cold distillation (pins, profile, size gate, freeze, claim ladder)"
        run: |
          . .venv/bin/activate
          python3 -B scripts/verify-cold-distillation.py

      - name: Composition-base contract (both bases, each under its own name)
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          python3 scripts/verify-composition-base.py

      - name: B3c simulated device (reference bound + six fault arms)
        run: |
          . .venv/bin/activate
          export PYTHONPATH="$PWD"
          python3 -m diamond.simulated_device --out out-b3c

      - name: Pinned-contract regression (toy c512d0c vs this revision)
        run: |
          . .venv/bin/activate
          python3 tests/pinned-contract/test-pinned-contract.py

      - name: Kira memory-v1 evidence consumer (offline, empty-directory arms)
        run: |
          # Deliberately NOT activated into the venv: the consumer is stdlib-only, and the
          # runner takes `node` off PATH itself. Run with the system interpreter so a hidden
          # third-party import would fail here rather than pass unnoticed.
          tests/kira-evidence/run-empty-dir-arms.sh "$RUNNER_TEMP/kira-empty-dir"

      - name: Kira digest binding and point validation
        run: python3 -B tests/kira-evidence/test_consistency.py

      - name: Approval artifact — current producer, offline controls
        run: |
          # The artifact lane is stdlib-only too, and the fixtures are DATA committed beside the
          # suite: no Genesis checkout and no network are needed or available here. The system
          # interpreter is used for the same reason as the step above.
          python3 -B tests/kira-artifact/test_kira_artifact.py

      - name: Approval artifact — empty-directory arms (isolated consumer environment)
        run: |
          tests/kira-artifact/run-empty-dir-arms.sh "$RUNNER_TEMP/kira-artifact"

      - name: Print exact SHA again
        if: always()
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_CI_SHA"
          echo "DIAMOND_CI_SHA=$(git rev-parse HEAD)"
          git rev-parse HEAD
