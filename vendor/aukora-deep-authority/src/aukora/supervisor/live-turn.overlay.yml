# Parent-staged overlay for one agent-loop turn against the idle 8088
# inventory. This file is not a patch to profiles/8088-inside-out/cordis.patch.yml.
# The parent launch selects and hashes it; the guest does not take --patch from argv.
# memory.put stays the 8088 v4 allow path. This overlay does not authorize writes.
#
# aukora-kira mounts kira.stage here rather than in profiles/8088-inside-out, so
# the idle inventory the base profile ships is unchanged: the staging route
# exists only for a parent-staged turn. Staging still authorizes nothing — the
# tool returns inert memory.put arguments, and that write takes the same v4
# allow path and the same parent stdin approval it always did.

- insert:
    - id: aukora-kira
      name: '@deepseek-ai/dsh-aukora-kira'

    - id: llm
      name: '@deepseek-ai/dsh-llm'

    - id: session
      name: '@deepseek-ai/dsh-session'

    - id: agent
      name: '@deepseek-ai/dsh-agent'

    - id: llm-deepseek
      name: '@deepseek-ai/dsh-llm-deepseek'
      config:
        thinking: disabled
        models:
          - id: deepseek-v4-flash
            contextWindow: 128000

    - id: agent-loop
      name: '@deepseek-ai/dsh-agent-loop'
      config:
        agents:
          - id: live-turn
            provider: deepseek-official
            model: deepseek-v4-flash
