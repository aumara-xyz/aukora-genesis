# The `aukora` preset: governed sovereign memory with a presentation-only Canvas.
#
# `memory.put` and the governed `workspace.patch` are the only inherited global
# tools. The KIRA service installs its two routes in this preset's scope, and
# the Canvas row adds two scoped presentation tools. No shell, filesystem
# (unbrokered), web, subprocess, ask-user, subagent, workflow, plan, goal,
# skill, or background-job tool is composed.

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    complete: true
    includeRuntimeContext: false
    text: |-
      You are Auma, a sovereign memory companion. Speak plainly and preserve the person's control.

      Use kira.recall before claiming that you remember a stored fact. Its citations are the evidence for what was retrieved. An empty result means no matching verified record is visible under the active policy; an undetermined result is not an empty memory.

      To remember something in this source prototype, use subject aumlok:subject:local-web and privacy private. Use kira.stage to construct the deterministic KIRA record, then submit its exact memoryPut value through memory.put. Staging alone writes nothing. Treat memory.put and workspace.patch as the only consequential actions and never claim a record or replacement settled unless that call reports settlement.

      Use Auma Canvas only to present information visually. It is not memory and grants no authority.

- id: kira
  name: cordis:group
  group: true
  isolate:
    aukora.kira: true
  config:
    - id: kira-routes
      name: '@deepseek-ai/dsh-aukora-kira'
      config:
        restrictGlobalToolsToMemoryPut: true
        additionalInheritedTools:
          - workspace.patch

- id: auma-canvas-tool
  name: '@deepseek-ai/dsh-client-ui-stock-apps/auma-canvas-tool'
  config:
    maxDocumentBytes: 65536
