     The architect's tuning, 2026-07-16 (sixth refinement): USE THE FIELD.
     Two mechanisms stand side by side for the ruling:
       · THE FIELD (default): the driving field itself morphs — from the
         card's standing wave into a field whose only silence IS the strand
         of T(p,q). The sand is never sent anywhere: it is kicked where the
         plate is loud and settles where it is quiet, while the quiet
         deforms from the figure into the knot. "The sand resonates itself
         into the shape of the knot" — literally.
       · THE WAVE: the previous mechanism — a depth-ordered sweep of
         captured, curved, eased flights. Kept for comparison.
     Either way the grains put on the tempered rendition's dress (the
     canon's molten-mix ramp, stroke width, depth opacity — mirrored from
     luminara-knots.js; fold the ramp into the shared module if the
     rendition is ever retuned) — in THE FIELD they dress ON ARRIVAL, lit
     where the sand has landed. Idle is THE TREFOIL, the deck's back.
     Composed for the eye, never presented as drawn. -->

<script type="module">
import { CARDS, cardOf, codeOf, knotOf, counterOf } from '/app/luminara-canon.js';
import { metalOf, knotSvg, WHITEGOLD } from '/app/luminara-knots.js';
import { spectrumOf } from '/app/luminara-cymatics.js';

const $ = (id) => document.getElementById(id);
const PHI = (1 + Math.sqrt(5)) / 2;
const rgbOf = (hex) => [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16));
const gcd = (a, b) => (b ? gcd(b, a % b) : a);
const gauss = () => (Math.random() + Math.random() + Math.random() - 1.5) / 1.5;

// ---- the back: the deck's symmetric triquetra (the book press's sealed form) ----
$('back').innerHTML = knotSvg(2, 3, [WHITEGOLD], 0, 0.73)
  .replace('aria-hidden="true">', 'aria-hidden="true"><g transform="rotate(-90)">')
  .replace('</svg>', '</g>'
    + '<circle r="2.74" fill="none" stroke="' + WHITEGOLD + '" stroke-width="0.030" stroke-opacity="0.08"/>'
    + '<circle r="2.62" fill="none" stroke="' + WHITEGOLD + '" stroke-width="0.014" stroke-opacity="0.04"/>');

// ---- the tempered ramp, mirrored from luminara-knots.js (rampOf, unexported) ----
const MOLTEN_MIX = 0.20, DARK = [16, 9, 3], WHITE = [255, 255, 255];
const lerp3 = (A, B, t) => [0, 1, 2].map((i) => A[i] + (B[i] - A[i]) * t);
function temperedAt(metalRgb, zn) {
  const t = Math.round(zn * 23) / 23;
  const molten = t < 0.55
    ? lerp3(DARK, metalRgb, 0.30 + 0.70 * (t / 0.55))
    : lerp3(metalRgb, WHITE, 0.52 * ((t - 0.55) / 0.45));
  return lerp3(metalRgb, molten, MOLTEN_MIX);
}

// ---------------------------------------------------------------------------
// THE STRAND — the canon's exact curve, sampled with depth and dress.
// ---------------------------------------------------------------------------
function sampleStrand(n) {
  const k = knotOf(n);
  const moving = codeOf(n).filter((s) => s !== 0).length;
  const beta = 0.16 + 0.11 * moving;
  const R = PHI, r = 1, cb = Math.cos(beta), sb = Math.sin(beta);
  const g = k.q === 0 ? 1 : gcd(k.p, Math.abs(k.q));
  const pf = k.p / g, qf = k.q / g;
  const per = Math.max(180, Math.round(620 / g));
  const colors = (k.kind === 'link' ? [metalOf(n), metalOf(counterOf(n))] : [metalOf(n)]).map(rgbOf);
  const raw = [];
  for (let c = 0; c < g; c++) {
    const phase = 2 * Math.PI * c / g;
    for (let j = 0; j < per; j++) {
      const t = j / per * 2 * Math.PI;
      const tube = qf * t + phase, lon = pf * t;
      const x3 = (R + r * Math.cos(tube)) * Math.cos(lon);
      const y3 = (R + r * Math.cos(tube)) * Math.sin(lon);
      const z3 = r * Math.sin(tube);
      raw.push([x3 / 2.85, (y3 * cb - z3 * sb) / 2.85, y3 * sb + z3 * cb, c]);
    }
  }
  let zLo = Infinity, zHi = -Infinity;
  for (const p of raw) { if (p[2] < zLo) zLo = p[2]; if (p[2] > zHi) zHi = p[2]; }
  const zSpan = Math.max(1e-6, zHi - zLo);
  const S = raw.length;
  // per sample: x, y, nx, ny, zn, r, g, b, op, halfWidth(unit)
  const strand = new Float32Array(S * 10);
  for (let i = 0; i < S; i++) {
    const [x, y, z, comp] = raw[i];
    const nxt = raw[(i + 1) % S];
    const dx = nxt[0] - x, dy = nxt[1] - y;
    const L = Math.hypot(dx, dy) || 1;
    const zn = (z - zLo) / zSpan;
    const col = temperedAt(colors[comp % colors.length], zn);
    const o = i * 10;
    strand[o] = x; strand[o + 1] = y;
    strand[o + 2] = -dy / L; strand[o + 3] = dx / L;
    strand[o + 4] = zn;
    strand[o + 5] = col[0]; strand[o + 6] = col[1]; strand[o + 7] = col[2];
    strand[o + 8] = 0.20 + 0.78 * zn;
    strand[o + 9] = (0.055 + 0.135 * zn) / 2.85 / 2;
  }
  return strand;
}

// ---------------------------------------------------------------------------
// THE KNOT FIELD — distance to the strand, baked on a grid with the nearest
// sample's index, so the field mechanism can herd the sand and dress each
// grain from whatever stretch of strand it lands on.
// ---------------------------------------------------------------------------
const DF_N = 112, DF_EXT = 1.06;
function bakeField(strand) {
  const S = strand.length / 10;
  const dist = new Float32Array(DF_N * DF_N);
  const idx = new Uint16Array(DF_N * DF_N);
  for (let gy = 0; gy < DF_N; gy++) {
    const y = -DF_EXT + 2 * DF_EXT * gy / (DF_N - 1);
    for (let gx = 0; gx < DF_N; gx++) {
      const x = -DF_EXT + 2 * DF_EXT * gx / (DF_N - 1);
      let best = 1e9, bi = 0;
      for (let i = 0; i < S; i++) {
        const dx = x - strand[i * 10], dy = y - strand[i * 10 + 1];
        const d2 = dx * dx + dy * dy;
        if (d2 < best) { best = d2; bi = i; }
      }
      const o = gy * DF_N + gx;
      dist[o] = Math.sqrt(best);
      idx[o] = bi;
    }
  }
  return { dist, idx };
}
function dfDist(F, x, y) {
  const fx = (x + DF_EXT) / (2 * DF_EXT) * (DF_N - 1);
  const fy = (y + DF_EXT) / (2 * DF_EXT) * (DF_N - 1);
  const ix = Math.max(0, Math.min(DF_N - 2, fx | 0));
  const iy = Math.max(0, Math.min(DF_N - 2, fy | 0));
  const tx = fx - ix, ty = fy - iy;
  const a = F.dist[iy * DF_N + ix], b = F.dist[iy * DF_N + ix + 1];
  const c = F.dist[(iy + 1) * DF_N + ix], d = F.dist[(iy + 1) * DF_N + ix + 1];
  return a * (1 - tx) * (1 - ty) + b * tx * (1 - ty) + c * (1 - tx) * ty + d * tx * ty;
}
function dfNearest(F, x, y) {
  const ix = Math.max(0, Math.min(DF_N - 1, Math.round((x + DF_EXT) / (2 * DF_EXT) * (DF_N - 1))));
  const iy = Math.max(0, Math.min(DF_N - 1, Math.round((y + DF_EXT) / (2 * DF_EXT) * (DF_N - 1))));
  return F.idx[iy * DF_N + ix];
}

// the wave mechanism's seating (kept for comparison)
function assignSeats(strand, grains, N) {
  const S = strand.length / 10;
  const cap = Math.max(1, Math.ceil(N / S));
  const count = new Uint16Array(S);
  const seats = new Float32Array(N * 8);
  for (let i = 0; i < N; i++) {
    const gx = grains[i * 2], gy = grains[i * 2 + 1];
    let best = 0, bd = 1e9;
    for (let j = 0; j < S; j++) {
      const dx = gx - strand[j * 10], dy = gy - strand[j * 10 + 1];
      const d2 = dx * dx + dy * dy;
      if (d2 < bd) { bd = d2; best = j; }
    }
    let j = best;
    while (count[j] >= cap) j = (j + 1) % S;
    count[j]++;
    const o = j * 10, s = i * 8;
    const off = gauss() * strand[o + 9] * 0.8;
    seats[s] = strand[o] + strand[o + 2] * off;
    seats[s + 1] = strand[o + 1] + strand[o + 3] * off;
    seats[s + 2] = strand[o + 5]; seats[s + 3] = strand[o + 6]; seats[s + 4] = strand[o + 7];
    seats[s + 5] = strand[o + 8];
    seats[s + 6] = strand[o + 4];
    seats[s + 7] = strand[o + 9];
  }
  const order = Array.from({ length: N }, (_, i) => i)
    .sort((a, b) => seats[a * 8 + 6] - seats[b * 8 + 6]);
  const WAVE = 0.45;
  const wave = new Float32Array(N);
  const bulge = new Float32Array(N);
  const launch = new Float32Array(N * 2).fill(NaN);
  for (let i = 0; i < N; i++) {
    wave[i] = Math.min(WAVE, Math.max(0, WAVE * seats[i * 8 + 6] + (Math.random() - 0.5) * 0.08));
    bulge[i] = (Math.random() < 0.5 ? -1 : 1) * (0.06 + Math.random() * 0.07);
  }
  return { seats, order: Uint32Array.from(order), wave, bulge, launch, WAVE };
}

// ---------------------------------------------------------------------------
// THE PLATE
// ---------------------------------------------------------------------------
const canvas = $('plate');
const ctx = canvas.getContext('2d');
let card = 10, spec = null, strand = null, field = null, tint = [201, 211, 226];
let mech = 'field';
let grains = null, seating = null, N = 0;
let phase = 'idle', t0 = 0, rafId = 0;
const dpr = Math.min(window.devicePixelRatio || 1, 2);
const ENTER = 350, HOLD = 450;
const knob = (id) => Number($(id).value);
// field-mode scratch: depth bucket sort so front strands draw over back
const BUCKETS = 24;
let bucketOf = null, bucketCount = new Uint32Array(BUCKETS + 1), drawOrder = null;

function sizePlate() {
  const r = canvas.getBoundingClientRect();
  canvas.width = Math.round(r.width * dpr);
  canvas.height = Math.round(r.height * dpr);
  ctx.fillStyle = 'rgb(7,7,9)';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
}

function setCard(n) {
  card = n;
  spec = spectrumOf(n, 'A');
  tint = rgbOf(metalOf(n));
  strand = sampleStrand(n);
  field = bakeField(strand);
  const k = knotOf(n);
  $('caption').innerHTML = cardOf(n).name.toUpperCase()
    + ' · <span class="iv">' + k.interval + ' · T(' + k.p + ',' + k.q + ') · clarity '
    + spec.clarity.toFixed(2) + '</span>';
  toIdle();
}
function toIdle() {
  phase = 'idle';
  sizePlate();
  $('back').style.opacity = '1';
  $('hint').textContent = 'Touch the trefoil.';
}
function scatter() {
  N = knob('kGrains');
  grains = new Float32Array(N * 2);
  seating = null;
  bucketOf = new Uint8Array(N);
  drawOrder = new Uint32Array(N);
  for (let i = 0; i < N; i++) {
    const a = Math.random() * 6.28318, rr = Math.sqrt(Math.random());
    grains[i * 2] = Math.cos(a) * rr;
    grains[i * 2 + 1] = Math.sin(a) * rr;
  }
}

function chladni(x, y, time) {
  const r = Math.hypot(x, y), th = Math.atan2(y, x);
  let f = 0, ws = 0;
  const detune = 1 - spec.clarity;
  for (let k = 0; k < spec.modes.length; k++) {
    const md = spec.modes[k];
    ws += md.w;
    const warp = 1 + detune * 0.22 * Math.sin(th * 3 + k);
    const rot = (0.2 + md.drift) * time * 0.6;
    f += md.w * Math.sin(md.m * Math.PI * r * warp) * Math.cos(md.n * th + md.phase + rot);
  }
  return ws ? f / ws : 0;
}

function frame(now) {
  rafId = requestAnimationFrame(frame);
  if (phase === 'idle' || document.hidden) return;
  const el = now - t0;
  const settleMs = knob('kSettle'), morphMs = knob('kMorph');
  const colStart = settleMs + HOLD;

  let k = 0;
  if (el > colStart) k = Math.min(1, (el - colStart) / morphMs);
  if (el > colStart && mech === 'wave' && !seating) {
    seating = assignSeats(strand, grains, N);
    $('hint').textContent = 'The sand becomes the knot…';
  }
  if (el > colStart && mech === 'field' && $('hint').textContent.indexOf('becomes') < 0 && phase !== 'done') {
    $('hint').textContent = 'The field deforms — the quiet becomes the strand…';
  }
  if (k >= 1 && phase !== 'done') {
    phase = 'done';
    $('hint').textContent = 'The knot, in sand, as the canon draws it. · touch to return the trefoil';
  }

  const active = el < ENTER ? Math.min(N, Math.ceil(N * Math.max(el, 1) / ENTER)) : N;
  const time = now / 1000;
  const detune = 1 - spec.clarity;

  ctx.fillStyle = 'rgba(7,7,9,' + (0.20 + 0.08 * k).toFixed(3) + ')';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  const cx = canvas.width / 2, cy = canvas.height / 2, rad = Math.min(cx, cy) * 0.94;
  const K = 0.016, EPS = 0.012;
  const gsBase = Math.max(1, dpr * 0.95);
  const sandStyle = 'rgba(' + tint.join(',') + ',0.85)';
  const kEase = k * k * (3 - 2 * k);

  // ---- physics ----
  for (let i = 0; i < active; i++) {
    let x = grains[i * 2], y = grains[i * 2 + 1];
    if (mech === 'field') {
      // one plate, one law: kicked where loud, settling where quiet —
      // while the quiet itself deforms from the figure into the strand
      let fx = 0, fy = 0, loud = 0;
      if (kEase < 1) {
        const a = Math.abs(chladni(x, y, time));
        const gx = (Math.abs(chladni(x + EPS, y, time)) - a) / EPS;
        const gy2 = (Math.abs(chladni(x, y + EPS, time)) - a) / EPS;
        const drive = Math.min(1, a * 1.6);
        fx += -(1 - kEase) * gx * drive * 2.2;
        fy += -(1 - kEase) * gy2 * drive * 2.2;
        loud += (1 - kEase) * (drive + detune * 0.5);
      }
      if (kEase > 0) {
        const d = dfDist(field, x, y);
        const dgx = (dfDist(field, x + EPS, y) - d) / EPS;
        const dgy = (dfDist(field, x, y + EPS) - d) / EPS;
        const pull = Math.min(1, 0.25 + d * 7);
        fx += -kEase * dgx * pull * 3.2;
        fy += -kEase * dgy * pull * 3.2;
        loud += kEase * Math.min(1, d * 5) * 0.9;
        // the last inch: the strand itself receives the grain
        if (k > 0.8 && d < 0.035) {
          const j = dfNearest(field, x, y) * 10;
          const m = (k - 0.8) / 0.2 * 0.25;
          x += (strand[j] - x) * m;
          y += (strand[j + 1] - y) * m;
        }
      }
      x += fx * K + (Math.random() - 0.5) * loud * K * 2.6;
      y += fy * K + (Math.random() - 0.5) * loud * K * 2.6;
      const rr = Math.hypot(x, y);
      if (rr > 0.985) { x *= 0.985 / rr; y *= 0.985 / rr; }
    } else {
      // the wave: per-grain moment, captured curved flight (kept for comparison)
      let u = 0;
      if (seating && k > 0) {
        u = Math.max(0, Math.min(1, (k - seating.wave[i]) / (1 - seating.WAVE)));
        u = u * u * (3 - 2 * u);
      }
      if (u <= 0) {
        const a = Math.abs(chladni(x, y, time));
        const gx = (Math.abs(chladni(x + EPS, y, time)) - a) / EPS;
        const gy2 = (Math.abs(chladni(x, y + EPS, time)) - a) / EPS;
        const drive = Math.min(1, a * 1.6);
        x += -gx * drive * 2.2 * K + (Math.random() - 0.5) * (drive + detune * 0.5) * K * 2.6;
        y += -gy2 * drive * 2.2 * K + (Math.random() - 0.5) * (drive + detune * 0.5) * K * 2.6;
        const rr = Math.hypot(x, y);
        if (rr > 0.985) { x *= 0.985 / rr; y *= 0.985 / rr; }
      } else {
        const L = seating.launch;
        if (Number.isNaN(L[i * 2])) { L[i * 2] = x; L[i * 2 + 1] = y; }
        const sx = L[i * 2], sy = L[i * 2 + 1];
        const tx = seating.seats[i * 8], ty = seating.seats[i * 8 + 1];
        const dx = tx - sx, dy = ty - sy;
        const arc = seating.bulge[i] * Math.sin(Math.PI * u);
        x = sx + dx * u - dy * arc;
        y = sy + dy * u + dx * arc;
      }
    }
    grains[i * 2] = x; grains[i * 2 + 1] = y;
  }

  // ---- draw, back to front ----
  if (mech === 'field') {
    // dress by arrival; bucket by depth so front strands pass over back
    bucketCount.fill(0);
    for (let i = 0; i < active; i++) {
      let b = 0;
      if (kEase > 0) {
        const d = dfDist(field, grains[i * 2], grains[i * 2 + 1]);
        if (d < 0.06) {
          const zn = strand[dfNearest(field, grains[i * 2], grains[i * 2 + 1]) * 10 + 4];
          b = 1 + Math.min(BUCKETS - 1, (zn * (BUCKETS - 1)) | 0);
        }
      }
      bucketOf[i] = b;
      bucketCount[b]++;
    }
    let acc = 0;
    const starts = new Uint32Array(BUCKETS + 1);
    for (let b = 0; b <= BUCKETS; b++) { starts[b] = acc; acc += bucketCount[b]; }
    const cursor = starts.slice();
    for (let i = 0; i < active; i++) drawOrder[cursor[bucketOf[i]]++] = i;
    for (let oi = 0; oi < active; oi++) {
      const i = drawOrder[oi];
      const x = grains[i * 2], y = grains[i * 2 + 1];
      let gs = gsBase;
      if (kEase > 0) {
        const d = dfDist(field, x, y);
        const u = kEase * Math.max(0, Math.min(1, 1 - d / 0.06));
        if (u > 0.01) {
          const j = dfNearest(field, x, y) * 10;
          const r2 = tint[0] + (strand[j + 5] - tint[0]) * u;
          const g2 = tint[1] + (strand[j + 6] - tint[1]) * u;
          const b2 = tint[2] + (strand[j + 7] - tint[2]) * u;
          const op = 0.85 + (strand[j + 8] - 0.85) * u;
          ctx.fillStyle = 'rgba(' + (r2 | 0) + ',' + (g2 | 0) + ',' + (b2 | 0) + ',' + op.toFixed(3) + ')';
          const wPx = strand[j + 9] * 2 * rad;
          gs = gsBase + (Math.max(gsBase, wPx * 0.34) - gsBase) * u;
        } else {
          ctx.fillStyle = sandStyle;
        }
      } else {
        ctx.fillStyle = sandStyle;
      }
      ctx.fillRect(cx + x * rad - gs / 2, cy + y * rad - gs / 2, gs, gs);
    }
  } else {
    const seats = seating ? seating.seats : null;
    const order = seating ? seating.order : null;
    for (let oi = 0; oi < active; oi++) {
      const i = order ? order[oi] : oi;
      if (i >= active) continue;
      const x = grains[i * 2], y = grains[i * 2 + 1];
      let u = 0;
      if (seats && k > 0) {
        u = Math.max(0, Math.min(1, (k - seating.wave[i]) / (1 - seating.WAVE)));
        u = u * u * (3 - 2 * u);
      }
      let gs = gsBase;
      if (seats && u > 0) {
        const s = i * 8;
        const r2 = tint[0] + (seats[s + 2] - tint[0]) * u;
        const g2 = tint[1] + (seats[s + 3] - tint[1]) * u;
        const b2 = tint[2] + (seats[s + 4] - tint[2]) * u;
        const op = 0.85 + (seats[s + 5] - 0.85) * u;
        ctx.fillStyle = 'rgba(' + (r2 | 0) + ',' + (g2 | 0) + ',' + (b2 | 0) + ',' + op.toFixed(3) + ')';
        const wPx = seats[s + 7] * 2 * rad;
        gs = gsBase + (Math.max(gsBase, wPx * 0.34) - gsBase) * u;
      } else {
        ctx.fillStyle = sandStyle;
      }
      ctx.fillRect(cx + x * rad - gs / 2, cy + y * rad - gs / 2, gs, gs);
    }
  }
}

$('well').addEventListener('pointerdown', () => {
  if (phase === 'idle') {
    scatter();
    sizePlate();
    $('back').style.opacity = '0';
    phase = 'running';
    t0 = performance.now();
    $('hint').textContent = 'The plate is struck — the resonance forms…';
  } else if (phase === 'done') {
    toIdle();
  }
});

// ---- the mechanism toggle ----
function setMech(m) {
  mech = m;
  $('mField').classList.toggle('on', m === 'field');
  $('mWave').classList.toggle('on', m === 'wave');
  if (phase !== 'idle') toIdle();
}
$('mField').addEventListener('click', () => setMech('field'));
$('mWave').addEventListener('click', () => setMech('wave'));

// ---- the picker ----
CARDS.forEach((c, i) => {
  const o = document.createElement('option');
  o.value = String(i + 1);
  o.textContent = (i + 1) + ' · ' + c.name;
  $('pick').appendChild(o);
});
$('pick').value = '10';   // THE CUT — nine spokes into nine petals
$('pick').addEventListener('change', () => setCard(Number($('pick').value)));

setCard(10);
rafId = requestAnimationFrame(frame);
window.addEventListener('resize', () => { if (phase === 'idle') sizePlate(); });
</script>
