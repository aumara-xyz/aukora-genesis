<!doctype html>
<!-- AUMA LUMINARA · THE DRAW (prototype, for the architect's eye).
     "The cube casts three": one living cube (the whole deck, the manifold),
     and a cast lifts three cells into the three houses. The toroidal knots
     are the faces. Consumes the sealed canon so what is shown is true.
     This is a first pass for tuning, not a sealed build. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LUMINARA · the draw</title>
<style>
  :root { --text:#e9e6dc; --dim:rgba(233,230,220,0.6); --faint:rgba(233,230,220,0.34); }
  html,body { margin:0; background:#0a0b0e; color:var(--text); font:14px/1.6 system-ui, sans-serif; }
  .wrap { max-width:460px; margin:0 auto; padding:22px 16px 60px; text-align:center; }
  h1 { font-size:14px; letter-spacing:0.34em; margin:0 0 3px;
    background:linear-gradient(100deg,#C9D3E2,#EFE7CF 55%,#F0C25E);
    -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent; }
  .sub { font-size:10px; letter-spacing:0.18em; color:var(--faint); margin-bottom:6px; }
  .lnav { display:flex; gap:18px; justify-content:center; margin:9px 0 2px; }
  .lnav a { font-size:10px; letter-spacing:0.22em; color:var(--faint); text-decoration:none; padding:3px 2px; border-bottom:1px solid transparent; }
  .lnav a:hover { color:var(--dim); }
  .lnav a.on { color:#EFE7CF; border-bottom-color:rgba(240,194,94,0.4); }
  .stage { width:100%; cursor:pointer; }
  .stage svg { width:100%; height:auto; display:block; overflow:visible; }
  .hint { font-size:11px; color:var(--dim); margin-top:8px; letter-spacing:0.03em; min-height:1.4em; }
  .read { font-size:12.5px; line-height:1.7; color:rgba(238,242,255,0.82); margin-top:10px; max-width:400px; margin-left:auto; margin-right:auto; }
  .read .whole { font-style:italic; color:rgba(238,242,255,0.9); margin-top:8px; padding-top:8px; border-top:1px solid rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div class="wrap">
  <h1>THE DRAW</h1>
  <div class="sub">THE CUBE CASTS THREE</div>
  <nav class="lnav">
    <a href="/app/luminara-read.html">THE WAYFINDER</a>
    <a href="/app/luminara-map-room.html">THE MAP ROOM</a>
    <a href="/app/luminara-ring.html">THE RING</a>
    <a href="/app/luminara-resonance.html">THE RESONANCE</a>
    <a href="/app/luminara-instrument.html">THE INSTRUMENT</a>
    <a href="/app/luminara-harmonic-language.html">THE LANGUAGE</a>
    <a href="/app/luminara-astrolabe.html">THE ASTROLABE</a>
    <a href="/app/luminara-rosette.html">THE ROSETTE</a>
    <a href="/app/luminara-spectrum.html">THE SPECTRUM</a>
    <a href="/app/luminara-workshop.html">THE WORKSHOP</a>
  </nav>
  <div class="stage" id="stage"></div>
  <div class="hint" id="hint">Hold your question. Tap three times.</div>
  <div class="read" id="read"></div>
</div>

<script type="module">
import { POSITIONS, drawThree, cardOf, codeOf, codeMarks, isSilent, knotOf, counterOf } from '/app/luminara-canon.js';
import { metalOf, knotPaths } from '/app/luminara-knots.js';
import { homeOf } from '/app/luminara-cube.js';

const $ = (id) => document.getElementById(id);
const WG = '#EFE7CF';

// ---- the isometric source cube (the manifold of 27) ----
const ISO = ([x, y, z], S, ox, oy) => [ox + (x - z) * 0.866 * S, oy + (x + z) * 0.5 * S - y * S * 1.05];

function markSvg(st, y, metal, cx, sc = 1) {
  if (st === 0) return '<circle cx="' + cx + '" cy="' + y + '" r="' + (1.8 * sc) + '" fill="' + metal + '" fill-opacity="0.85"/>';
  if (st === 1) return '<rect x="' + (cx - 6 * sc) + '" y="' + (y - 1 * sc) + '" width="' + (12 * sc) + '" height="' + (2 * sc) + '" rx="1" fill="' + metal + '" fill-opacity="0.85"/>';
  return '<path d="M' + (cx - 6 * sc) + ' ' + y + ' q' + (1.5 * sc) + ' ' + (-2.4 * sc) + ' ' + (3 * sc) + ' 0 t' + (3 * sc) + ' 0 t' + (3 * sc) + ' 0" stroke="' + metal + '" stroke-opacity="0.85" stroke-width="' + (1.3 * sc) + '" fill="none" stroke-linecap="round"/>';
}

// a risen card: the knot face, the four corners, marks, name, interval
function cardSvg(n, cx, cy, posLabel) {
  const k = knotOf(n), metal = metalOf(n), cn = counterOf(n), cmetal = metalOf(cn);
  const colors = k.kind === 'link' ? [metal, cmetal] : [metal];
  const d = codeOf(n), moving = d.filter((s) => s !== 0).length;
  const qL = k.q > 0 ? '+' + k.q : String(k.q);
  const cqL = k.q === 0 ? '0' : k.q < 0 ? '+' + (-k.q) : String(-k.q);
  const W = 118, H = 156, x0 = cx - W / 2, y0 = cy - H / 2;
  let s = '<g>';
  s += '<text x="' + cx + '" y="' + (y0 - 8) + '" text-anchor="middle" font-size="8" letter-spacing="1.5" fill="rgba(233,230,220,0.5)">' + posLabel.toUpperCase() + '</text>';
  s += '<rect x="' + x0 + '" y="' + y0 + '" width="' + W + '" height="' + H + '" rx="12" fill="#070709" stroke="' + metal + '" stroke-opacity="0.42" stroke-width="1"/>';
  // corners
  const mono = 'font-family="ui-monospace,monospace" font-size="8"';
  s += '<text x="' + (x0 + 8) + '" y="' + (y0 + 14) + '" ' + mono + ' fill="' + metal + '" fill-opacity="0.85">' + n + '</text>';
  s += '<text x="' + (x0 + W - 8) + '" y="' + (y0 + 14) + '" text-anchor="end" ' + mono + ' fill="rgba(233,230,220,0.45)">' + qL + '</text>';
  s += '<text x="' + (x0 + 8) + '" y="' + (y0 + H - 6) + '" ' + mono + ' fill="rgba(233,230,220,0.45)">' + cqL + '</text>';
  s += '<text x="' + (x0 + W - 8) + '" y="' + (y0 + H - 6) + '" text-anchor="end" ' + mono + ' fill="' + cmetal + '" fill-opacity="0.85">' + cn + '</text>';
  // the knot face
  const sc = 15.5;
  s += '<g transform="translate(' + cx + ' ' + (cy - 22) + ') scale(' + sc + ')" style="filter:drop-shadow(0 0 0.18px ' + metal + '66)">'
    + knotPaths(k.p, k.q, colors, 0.16 + 0.11 * moving, 0.62) + '</g>';
  // marks, name, interval
  s += markSvg(d[0], cy + 44, metal, cx - 13) + markSvg(d[1], cy + 44, metal, cx) + markSvg(d[2], cy + 44, metal, cx + 13);
  s += '<text x="' + cx + '" y="' + (cy + 62) + '" text-anchor="middle" font-size="10.5" letter-spacing="1.2" fill="#f2efe6">' + cardOf(n).name.toUpperCase() + '</text>';
  s += '<text x="' + cx + '" y="' + (cy + 74) + '" text-anchor="middle" font-size="7.5" font-style="italic" fill="rgba(233,230,220,0.6)">' + k.interval + '</text>';
  return s + '</g>';
}

function render(cast) {
  const VBW = 420, VBH = 720;
  const cxs = [80, 210, 340], cy = 150;
  const cubeC = [212, 500], S = 46;
  let s = '<svg viewBox="0 0 ' + VBW + ' ' + VBH + '" aria-hidden="true">';

  // ---- the source cube: 27 cells; drawn ones become empty sockets ----
  const cells = [];
  for (let m = 1; m <= 27; m++) cells.push({ n: m, p: homeOf(m) });
  cells.sort((a, b) => (a.p[0] + a.p[2]) - (b.p[0] + b.p[2]) || a.p[1] - b.p[1]);
  const drawn = new Set(cast);
  let sockets = {};
  for (const c of cells) {
    const [px, py] = ISO(c.p, S, cubeC[0], cubeC[1]);
    const metal = metalOf(c.n);
    if (drawn.has(c.n)) {
      sockets[c.n] = [px, py];
      s += '<circle cx="' + px + '" cy="' + py + '" r="6.5" fill="none" stroke="' + metal + '" stroke-opacity="0.5" stroke-width="1" stroke-dasharray="1.5 2"/>';
    } else if (c.n === 1) {
      s += '<circle cx="' + px + '" cy="' + py + '" r="3.4" fill="' + WG + '" fill-opacity="0.9"/>';
    } else {
      s += '<circle cx="' + px + '" cy="' + py + '" r="2.4" fill="' + metal + '" fill-opacity="0.4"/>';
    }
  }
  s += '<text x="' + cubeC[0] + '" y="' + (cubeC[1] + 130) + '" text-anchor="middle" font-size="8" letter-spacing="1.5" fill="rgba(233,230,220,0.34)">THE DECK · TWENTY SEVEN · THE SEED AT ITS HEART</text>';

  // ---- the flows between the three risen cards (the spaces between) ----
  cast.forEach((n, i) => cast.forEach((m, j) => {
    if (j <= i) return;
    const dyad = counterOf(n) === m;
    const shared = knotOf(n).interval === knotOf(m).interval;
    const [x1, x2] = [cxs[i], cxs[j]];
    const midY = cy - 96;
    const op = dyad ? 0.5 : shared ? 0.3 : 0.12;
    const col = dyad ? WG : 'rgba(233,230,220,1)';
    s += '<path d="M' + x1 + ' ' + (cy - 78) + ' Q' + ((x1 + x2) / 2) + ' ' + midY + ' ' + x2 + ' ' + (cy - 78)
      + '" fill="none" stroke="' + col + '" stroke-opacity="' + op + '" stroke-width="' + (dyad ? 1 : 0.6) + '"'
      + (dyad ? '' : ' stroke-dasharray="2 3"') + '/>';
    if (dyad) s += '<text x="' + ((x1 + x2) / 2) + '" y="' + (midY - 3) + '" text-anchor="middle" font-size="7" font-style="italic" fill="' + WG + '" fill-opacity="0.7">a dyad · answer to answer</text>';
  }));

  // ---- lines from each risen card down to its origin socket ----
  cast.forEach((n, i) => {
    if (sockets[n]) {
      const [sx, sy] = sockets[n];
      s += '<path d="M' + cxs[i] + ' ' + (cy + 82) + ' C' + cxs[i] + ' ' + (cy + 180) + ' ' + sx + ' ' + (sy - 90) + ' ' + sx + ' ' + sy
        + '" fill="none" stroke="' + metalOf(n) + '" stroke-opacity="0.22" stroke-width="0.7" stroke-dasharray="2 4"/>';
    }
  });

  // ---- the three risen cards ----
  cast.forEach((n, i) => { s += cardSvg(n, cxs[i], cy, POSITIONS[i].name); });

  return s + '</svg>';
}

function renderReading(cast) {
  const lines = cast.map((n, i) => {
    const nm = cardOf(n).name;
    const ess = cardOf(n).essence.split(/[.:]/)[0];
    return '<div><b>' + POSITIONS[i].name + '</b> · ' + nm + ': ' + ess + '.</div>';
  });
  const home = cast.map((n) => cardOf(n).name);
  return lines.join('') + '<div class="whole">From ' + home[0] + ', through ' + home[1] + ', toward ' + home[2] + '.</div>';
}

// ---- the rite ----
let taps = [], lastTap = 0, done = false;
function cast(seed) {
  const c = drawThree(seed);
  $('stage').innerHTML = render(c);
  $('read').innerHTML = renderReading(c);
  $('hint').textContent = 'What lands is a mirror, not a verdict. · tap to cast anew';
  done = true;
}
// auto-cast a fixed demo so the concept is visible at once
cast('draw-demo-alpha');

document.addEventListener('pointerdown', () => {
  const now = performance.now();
  if (now - lastTap < 300) return; lastTap = now;
  if (done) { done = false; taps = []; $('hint').textContent = 'Hold your question. Tap three times.'; $('read').innerHTML = ''; $('stage').innerHTML = render([]); return; }
  taps.push(Math.round(now) + ':' + Date.now());
  $('hint').textContent = '●'.repeat(taps.length) + '○'.repeat(3 - taps.length);
  if (taps.length === 3) cast('draw|' + taps.join('|'));
});
</script>
</body>
</html>
